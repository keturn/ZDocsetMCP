[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "docsetmcp"
version = "0.3.3"
description = "Search local documentation from Dash through MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cody Bromley", email = "dev@codybrom.com" },
]
maintainers = [
    { name = "Kevin Turner" }
]
keywords = ["mcp", "model-context-protocol", "dash", "zeal", "documentation", "llm", "docset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.1.0",
    "PyYAML>=6.0",
    "fastmcp~=4.1.6",
    "beautifulsoup4>=4.14.3",
    "html-to-markdown>=2.28.2",
    "tdom==0.1.20",
    "starlette>=0.52.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pyrefly>=0.56.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.6",
    "yamlfix>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/keturn/ZDocsetMCP"
"Bug Reports" = "https://github.com/keturn/ZDocsetMCP/issues"
Source = "https://github.com/keturn/ZDocsetMCP"

[project.scripts]
docsetmcp = "docsetmcp.main:main"

[tool.uv.build-backend]
module-name = "docsetmcp"
module-root = ""

[tool.yamlfix]
preserve_quotes = true
explicit_start = false
sort_keys = true
sequence_style = "block_style"
line_length = 120
section_whitelines = 0

[tool.pyright]
stubPath = "stubs"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingImports = true
reportUnnecessaryCast = true
reportUntypedFunctionDecorator = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist", ".venv"]

[tool.ruff]
line-length = 100
