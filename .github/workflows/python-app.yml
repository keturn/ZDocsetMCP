name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: astral-sh/setup-uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Install dependencies
      run: uv sync
    - name: Test with pytest
      run: uv run pytest --junit-xml=test-report.xml tests/
    - uses: actions/upload-artifact@v7.0.2  # upload test results
      if: ${{ !cancelled() }}           # run this step even if previous step failed
      with:
        name: test-results
        path: test-report.xml
