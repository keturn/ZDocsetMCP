name: 'Test Report'
on:
  workflow_run:
    workflows: ['CI']                     # runs after CI workflow
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v3.0.0
      with:
        artifact: test-results            # artifact name
        name: pytest                      # Name of the check run which will be created
        path: 'test-report.xml'          # Path to test results (inside artifact .zip)
        reporter: python-xunit            # Format of test results
